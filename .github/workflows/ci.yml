name: Android CI

on:
  push:
    branches-ignore:
      # release/* branches are handled by release.yml (version bump)
      - "release/**"
      # main is populated only via merged release PRs, handled by release_deploy.yml
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew assembleDebug
      - name: Run Tests with Gradle
        run: ./gradlew test
