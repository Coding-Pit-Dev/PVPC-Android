name: Android CI

on:
  push:
    branches-ignore:
      # release/* branches are handled by release.yml (version bump)
      - "release/**"
      # main is populated only via merged release PRs, handled by release_deploy.yml
      - "main"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Verify and build with Gradle
        run: ./gradlew --continue ktlintCheck detekt lintDebug assembleDebug test
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: app/build/reports/lint*
          if-no-files-found: ignore
          retention-days: 7
